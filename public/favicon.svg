      <stop offset="100%" stop-color="#1a0028" />
    </linearGradient>
    <linearGradient id="bow" x1="24" y1="44" x2="40" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff69b4" />
      <stop offset="100%" stop-color="#ff0040" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)" />
  <rect x="3.5" y="3.5" width="57" height="57" rx="11" fill="none" stroke="#ffe600" stroke-width="2.5" stroke-dasharray="5 3.5" />

  <!-- Koala Ohr links -->
  <circle cx="17" cy="21" r="10" fill="#8b6f5c" />
  <circle cx="17" cy="21" r="6" fill="#c4a48a" />

  <!-- Alpaka Flausch rechts -->
  <ellipse cx="47" cy="24" rx="11" ry="13" fill="#f3e4cf" />
  <path d="M38 18c2-6 8-8 12-4 4 4 2 10-2 12" fill="#e8d4b8" />

  <!-- Gesichter -->
  <ellipse cx="24" cy="30" rx="11" ry="10" fill="#b8957a" />
  <ellipse cx="40" cy="31" rx="10" ry="9.5" fill="#f0dcc4" />

  <!-- Koala-Nase -->
  <ellipse cx="24" cy="33" rx="4.2" ry="3.2" fill="#2a1520" />
  <circle cx="19.5" cy="28.5" r="1.6" fill="#2a1520" />
  <circle cx="28.5" cy="28.5" r="1.6" fill="#2a1520" />

