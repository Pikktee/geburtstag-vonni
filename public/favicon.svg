  <rect x="22" y="42" width="20" height="14" rx="2" fill="url(#bow)" stroke="#ffe600" stroke-width="1.2" />
  <path d="M32 42 V56 M22 49 H42" stroke="#ffe600" stroke-width="1.6" />
  <path d="M26 42c-4-4-8-2-8 2 0 3 4 4 8 0 M38 42c4-4 8-2 8 2 0 3-4 4-8 0" fill="#ff69b4" stroke="#fff" stroke-width="0.8" />

  <!-- Funken -->
  <path d="M8 10 L10 14 L14 12 L10 16 L8 20 L6 16 L2 12 L6 14 Z" fill="#ffe600" />
  <path d="M56 8 L57.5 11 L60.5 9.5 L58 12.5 L56 15.5 L54 12.5 L51.5 9.5 L54.5 11 Z" fill="#00ff66" />
