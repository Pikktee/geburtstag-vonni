  <ellipse cx="40" cy="34.5" rx="3.2" ry="2.4" fill="#d9b8a0" />
  <circle cx="36.5" cy="29.5" r="1.4" fill="#3a2030" />
  <circle cx="43.5" cy="29.5" r="1.4" fill="#3a2030" />

